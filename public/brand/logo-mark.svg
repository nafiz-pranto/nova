<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- LeadNoria Circular Research & Abstract N Geometry -->
  <rect width="100" height="100" rx="22" fill="#0F172A" />
  
  <!-- Outer continuous circular research loop (orbit of public signals) -->
  <circle cx="50" cy="50" r="38" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  
  <!-- Abstract "N" Continuous Layered Connected Signal Flow -->
  <!-- Left ascending signal path -->
  <path d="M 30 72 L 30 28 C 30 25 34 24 36 27 L 64 73 C 66 76 70 75 70 72 L 70 28" 
        stroke="url(#leadnoria-flow)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Layered signal nodes: Discovery, Evidence, Verified Lead -->
  <circle cx="30" cy="72" r="4.5" fill="#A78BFA" />
  <circle cx="50" cy="50" r="3.5" fill="#F8FAFC" />
  <circle cx="70" cy="28" r="4.5" fill="#8B5CF6" />
  
  <!-- Subtle accent flow orbit arc -->
  <path d="M 24 38 A 38 38 0 0 1 76 38" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <path d="M 76 62 A 38 38 0 0 1 24 62" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <defs>
    <linearGradient id="leadnoria-flow" x1="28" y1="72" x2="72" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>
</svg>
