<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%" fill="none">
  <!-- Brand Mark Icon -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="#0F172A" />
    <circle cx="28" cy="28" r="21" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
    <path d="M 17 40 L 17 16 C 17 14 19 13.5 20.5 15.5 L 35.5 40.5 C 37 42.5 39 42 39 40 L 39 16" 
          stroke="url(#horiz-grad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <circle cx="17" cy="40" r="2.8" fill="#A78BFA" />
    <circle cx="28" cy="28" r="2" fill="#F8FAFC" />
    <circle cx="39" cy="16" r="2.8" fill="#8B5CF6" />
  </g>

  <!-- Wordmark -->
  <text x="74" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
    Lead<tspan fill="#A78BFA">Noria</tspan>
  </text>
  
  <!-- Tagline / Descriptor -->
  <text x="75" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#94A3B8" letter-spacing="0.3">
    Discover. Verify. Connect.
  </text>

  <defs>
    <linearGradient id="horiz-grad" x1="16" y1="40" x2="40" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>
</svg>
